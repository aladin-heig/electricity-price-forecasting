[project]
name = "electricity-price-forecasting"
version = "0.1.0"
description = "Day-ahead electricity spot price forecasting (DE-LU): classical statistical models vs zero-shot foundation models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aladin" }, { name = "Léon" }]
dependencies = [
    "pandas>=2.2",
    "numpy",
    "pyarrow",
    "entsoe-py",
    "holidays",
    "statsmodels>=0.14",
    "scipy",
    "matplotlib",
    "python-dotenv",
    "jupyterlab",
    "ipykernel",
    # Foundation models (Linux PyPI torch wheels ship with CUDA)
    "torch>=2.4",
    "timesfm[torch]>=3.0",
    "timestral @ git+https://github.com/mistralai/timestral.git",
]

[dependency-groups]
dev = ["nbstripout"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
